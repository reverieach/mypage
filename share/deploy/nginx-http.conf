# Install as /etc/nginx/sites-available/mypage-share, then obtain a certificate.
limit_req_zone $binary_remote_addr zone=mypage_pair:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=mypage_api:1m rate=10r/s;
server {
    listen 80;
    server_name share.reverieach.com;
    client_max_body_size 200m;
    client_body_timeout 60s;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:3230;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        limit_req zone=mypage_api burst=30 nodelay;
    }
    location = /api/pair {
        limit_req zone=mypage_pair burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3230;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /ws {
        limit_req zone=mypage_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:3230;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
